name: Release Death Rewind Fabric 26.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 26.1
    runs-on: ubuntu-24.04
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Check out Death Rewind
        uses: actions/checkout@v4

      - name: Check out MineBackup-Mod API
        uses: actions/checkout@v4
        with:
          repository: Leafuke/MineBackup-Mod
          path: MineBackup-Mod

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          mod_version="$(sed -n 's/^mod_version=//p' Fabric/Fabric-26.1/gradle.properties | head -n 1 | tr -d '\r')"
          if [ -z "$mod_version" ]; then
            echo "::error file=Fabric/Fabric-26.1/gradle.properties::mod_version not found"
            exit 1
          fi
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_name=Death Rewind v$mod_version" >> "$GITHUB_OUTPUT"

      - name: Make wrapper executable
        working-directory: Fabric/Fabric-26.1
        run: chmod +x gradlew

      - name: Composite clean build
        working-directory: Fabric/Fabric-26.1
        run: >-
          ./gradlew clean build --warning-mode all
          -PminebackupDir="${{ github.workspace }}/MineBackup-Mod/Fabric/Fabric-26.1"

      - name: Prepare release asset
        shell: bash
        env:
          MOD_VERSION: ${{ steps.version.outputs.mod_version }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/release-assets"
          artifact_name="deathrewind-fabric-26.1-${MOD_VERSION}.jar"
          mkdir -p "$release_dir"

          mapfile -t jars < <(find Fabric/Fabric-26.1/build/libs -maxdepth 1 \
            -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one releasable jar, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          cp "${jars[0]}" "$release_dir/$artifact_name"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-fabric-26.1
          path: release-assets/*.jar
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download built asset
        uses: actions/download-artifact@v4
        with:
          name: release-fabric-26.1
          path: release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
