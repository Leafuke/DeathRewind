name: Death Rewind Fabric 26.1 check

on:
  push:
    paths:
      - "Fabric/Fabric-26.1/**"
      - ".github/workflows/deathrewind-fabric-26.1-check.yml"
  pull_request:
    paths:
      - "Fabric/Fabric-26.1/**"
      - ".github/workflows/deathrewind-fabric-26.1-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Fabric/Fabric-26.1

    steps:
      - name: Check out Death Rewind
        uses: actions/checkout@v4

      - name: Check out MineBackup-Mod API
        uses: actions/checkout@v4
        with:
          repository: Leafuke/MineBackup-Mod
          path: MineBackup-Mod

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Composite clean build
        run: >-
          ./gradlew clean build --warning-mode all
          -PminebackupDir="${{ github.workspace }}/MineBackup-Mod/Fabric/Fabric-26.1"
